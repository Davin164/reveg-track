version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
    ports:
      - "8000:8000"
      - "5173:5173"
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=reveg
      - DB_USERNAME=postgres
      - DB_PASSWORD=secret
    depends_on:
      - db
  db:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: reveg
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - reveg-dev-db:/var/lib/postgresql/data

volumes:
  reveg-dev-db:
